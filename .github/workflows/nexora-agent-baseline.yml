name: Nexora Agent Baseline

on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run orchestrator baseline
        run: |
          chmod +x ops/agents/scripts/*.sh
          bash ops/agents/scripts/run_orchestrator.sh baseline

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: nexora-agent-baseline-reports
          path: ops/agents/reports
