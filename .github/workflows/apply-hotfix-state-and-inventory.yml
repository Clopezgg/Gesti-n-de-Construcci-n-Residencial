name: Apply hotfix state and inventory

on:
  push:
    branches:
      - hotfix/main-post-merge-ci
    paths:
      - .github/workflows/apply-hotfix-state-and-inventory.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/main-post-merge-ci
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Finalize state and regenerate inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          state_path = Path("EXECUTION_STATE.md")
          lines = state_path.read_text(encoding="utf-8").splitlines()
          output: list[str] = []
          has_pr15 = any(line.startswith("- PR #15:") for line in lines)
          has_final_integration = any(
              line.startswith("- Integración final NEXORA certificada:") for line in lines
          )

          for line in lines:
              output.append(line)
              if line.startswith("- PR #14:") and not has_pr15:
                  output.append(
                      "- PR #15: fusionado mediante squash en `main`; árbol funcional validado en "
                      "`37d5d996b16871b30b498e19bd44cb08e791d0cc` e integrado mediante "
                      "`718633009014234fcb183d3c33695f238871e056`."
                  )
              if line.startswith("- SHA funcional del lote 1 de la Fase 1:") and not has_final_integration:
                  output.append(
                      "- Integración final NEXORA certificada: "
                      "`718633009014234fcb183d3c33695f238871e056`"
                  )

          text = "\n".join(output) + "\n"
          text = re.sub(
              r"^- HEAD de `main` verificado: `b65f7c119b5b15620ae312d11cb3eb3447b25b86`$",
              "- HEAD inicial de `main`: `b65f7c119b5b15620ae312d11cb3eb3447b25b86`",
              text,
              flags=re.MULTILINE,
          )
          text = re.sub(
              r"^\|\s*11 — Buscador y dashboard.*$",
              "| 11 — Buscador y dashboard | **IMPLEMENTADO Y VALIDADO** | "
              "`37d5d996b16871b30b498e19bd44cb08e791d0cc` | — |",
              text,
              flags=re.MULTILINE,
          )
          text = re.sub(
              r"^\|\s*18 — Identidad, UX, iPhone, PWA.*$",
              "| 18 — Identidad, UX, iPhone, PWA | **IMPLEMENTADO Y VALIDADO** | "
              "`37d5d996b16871b30b498e19bd44cb08e791d0cc` | — |",
              text,
              flags=re.MULTILINE,
          )
          state_path.write_text(text, encoding="utf-8")

          live_progress = {
              "schema_version": 1,
              "agent_status": "validated",
              "phase": "Fases 2 y 3 — entrega final NEXORA",
              "task": "Mantener main como fuente única de verdad y validar cada integración antes de publicar",
              "detail": (
                  "PR #15 fusionado. Escritorio, iPhone WebKit, PWA, instalación, rollback, "
                  "gobierno, finanzas y producción fueron validados sobre el árbol funcional "
                  "37d5d996b16871b30b498e19bd44cb08e791d0cc e integrado en main mediante "
                  "718633009014234fcb183d3c33695f238871e056."
              ),
              "started_at": "2026-07-26T08:00:00-06:00",
              "last_update": "2026-07-26T17:39:39-06:00",
              "tests": [
                  "NEXORA app: contratos, instalación, rollback, escritorio, iPhone WebKit y PWA aprobados",
                  "NEXORA financial invariants: MariaDB, concurrencia, rollback e idempotencia aprobados",
                  "NEXORA governance, Linters, Patch y producción aprobados en el SHA funcional",
                  "PR #15 fusionado sin bypass después de validar el mismo SHA funcional",
              ],
              "events": [
                  {
                      "time": "2026-07-26T17:39:39-06:00",
                      "type": "final_integration",
                      "status": "validated",
                      "message": (
                          "PR #15 fusionado en main mediante "
                          "718633009014234fcb183d3c33695f238871e056."
                      ),
                  }
              ],
              "blocking_issue": None,
          }
          Path("docs/nexora/LIVE_PROGRESS.json").write_text(
              json.dumps(live_progress, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python -m pip install pre-commit==3.8.0
          set +e
          pre-commit run --all-files --show-diff-on-failure
          first_status=$?
          set -e
          if [[ "$first_status" != "0" ]]; then
            pre-commit run --all-files --show-diff-on-failure
          fi

          python scripts/generate_file_inventory.py
          set +e
          pre-commit run --files docs/architecture/file_inventory.json --show-diff-on-failure
          inventory_status=$?
          set -e
          if [[ "$inventory_status" != "0" ]]; then
            pre-commit run --files docs/architecture/file_inventory.json --show-diff-on-failure
          fi

          python scripts/validate_nexora_governance.py
          python scripts/validate_nexora_operational_acceptance.py
          python scripts/validate_nexora_completion.py
          python -m py_compile \
            scripts/validate_nexora_governance.py \
            scripts/validate_nexora_operational_acceptance.py \
            scripts/validate_nexora_completion.py

      - name: Commit validated hotfix state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EXECUTION_STATE.md \
            docs/nexora/LIVE_PROGRESS.json \
            docs/architecture/file_inventory.json \
            scripts/validate_nexora_governance.py \
            scripts/validate_nexora_operational_acceptance.py \
            scripts/validate_nexora_completion.py \
            .github/workflows/nexora-governance.yml \
            .github/workflows/nexora-financial.yml \
            .github/workflows/linters.yml \
            .github/workflows/nexora-final-delivery.yml
          git commit -m "fix(ci): finalize post-merge validation state"
          git push origin HEAD:hotfix/main-post-merge-ci
