name: Nexora Router Handoff

on:
  workflow_dispatch:

jobs:
  router-handoff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Ensure scripts executable
        run: chmod +x ops/agents/scripts/*.sh

      - name: Run router handoff
        run: bash ops/agents/scripts/router_handoff.sh

      - name: Upload router handoff artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-router-handoff-artifacts
          path: |
            ops/agents/reports
            ops/agents/state
