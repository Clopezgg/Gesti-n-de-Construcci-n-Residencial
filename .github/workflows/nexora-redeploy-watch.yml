name: Nexora Redeploy Watch

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Objetivo del redeploy"
        required: false
        default: "manual-redeploy"

jobs:
  redeploy-watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure scripts executable
        run: chmod +x ops/agents/scripts/*.sh

      - name: Regression scan
        run: bash ops/agents/scripts/regression_scan.sh

      - name: Redeploy watch gate
        run: bash ops/agents/scripts/redeploy_watch.sh "${{ github.event.inputs.target }}"

      - name: Upload redeploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-redeploy-watch-artifacts
          path: |
            ops/agents/reports
            ops/agents/state
