name: ChatGPT Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run ChatGPT Code Review
        uses: anc95/ChatGPT-CodeReview@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_ENDPOINT: https://api.openai.com/v1

          MODEL: gpt-4o-mini

          LANGUAGE: Spanish

          PROMPT: |
            Actúa como un ingeniero senior de software.
            Revisa este Pull Request buscando:
            - errores de lógica
            - problemas de seguridad
            - errores de arquitectura
            - problemas de rendimiento
            - malas prácticas
            - oportunidades de refactorización

            Explica cada problema encontrado y propone una solución.

          temperature: 0.3
          top_p: 1
          max_tokens: 10000

          MAX_PATCH_LENGTH: 10000

          IGNORE_PATTERNS: |
            node_modules/**/*
            dist/**/*
            build/**/*
            *.md

          INCLUDE_PATTERNS: |
            *.js
            *.jsx
            *.ts
            *.tsx
            *.py
            *.sql
            *.php
