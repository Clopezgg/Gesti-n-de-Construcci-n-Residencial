name: Nexora Guided Review

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Objetivo de revisión"
        required: false
        default: "manual"

jobs:
  guided-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Ensure scripts executable
        run: chmod +x ops/agents/scripts/*.sh

      - name: Run guided review
        run: bash ops/agents/scripts/guided_review.sh "${{ github.event.inputs.target }}"

      - name: Upload guided review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-guided-review-artifacts
          path: |
            ops/agents/reports
            ops/agents/state
