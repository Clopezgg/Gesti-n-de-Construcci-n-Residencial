name: NEXORA financial invariants

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - EXECUTION_STATE.md
      - nexora_app/**
      - scripts/validate_nexora_app.py
      - scripts/validate_nexora_financial_models.py
      - scripts/register_nexora_app.py
      - scripts/validate_nexora_governance.py
      - .github/workflows/nexora-financial.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      mysql:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Static and deterministic gates
        env:
          EXPECTED_MAIN_HEAD: ${{ github.event_name == 'push' && (github.event.before || '') || '' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/nexora-financial
          {
            python scripts/validate_nexora_governance.py --expected-main-head "$EXPECTED_MAIN_HEAD"
            python scripts/validate_nexora_app.py
            python scripts/validate_nexora_financial_models.py
            PYTHONPATH=nexora_app python -m unittest discover -s nexora_app/nexora/tests -p 'test_*contract.py' -v
            PYTHONPATH=nexora_app python -m unittest nexora.tests.test_financial_core nexora.tests.test_ledger_core nexora.tests.test_reference_rules nexora.tests.test_evidence_core nexora.tests.test_directory_core nexora.tests.test_contract_core nexora.tests.test_purchase_core nexora.tests.test_purchase_request_core nexora.tests.test_quotation_core nexora.tests.test_executive_analytics nexora.tests.test_sap_integration_core -v
            node --check nexora_app/nexora/nexora/page/nexora_dashboard/nexora_dashboard.js
            node --check nexora_app/nexora/nexora/page/nexora_reports/nexora_reports.js
            node --check nexora_app/nexora/nexora/page/nexora_closing/nexora_closing.js
            node --check nexora_app/nexora/nexora/page/nexora_finance/nexora_finance.js
            node --check nexora_app/nexora/nexora/page/nexora_evidence/nexora_evidence.js
            node --check nexora_app/nexora/nexora/page/nexora_entities/nexora_entities.js
            node --check nexora_app/nexora/nexora/page/nexora_contracts/nexora_contracts.js
            node --check nexora_app/nexora/nexora/page/nexora_suppliers/nexora_suppliers.js
            node --check nexora_app/nexora/nexora/page/nexora_purchase_requests/nexora_purchase_requests.js
            node --check nexora_app/nexora/nexora/page/nexora_quotations/nexora_quotations.js
            node --check nexora_app/nexora/public/js/nexora.js
            node --check nexora_app/nexora/public/js/nexora_quick_flows.js
            node --check nexora_app/nexora/public/js/nexora_guided_model.js
            node --check nexora_app/nexora/public/js/nexora_guided_operations.js
            node --check nexora_app/nexora/public/js/nexora_report_actions.js
            node --check nexora_app/nexora/www/nexora-service-worker.js
            node --check scripts/nexora_browser_smoke.mjs
            python -m compileall -q nexora_app/nexora scripts
          } 2>&1 | tee artifacts/nexora-financial/static.log
      - name: Install ERPNext test bench
        # El paso completo (bench + sitio + invariantes) históricamente termina en
        # unos 7-8 minutos; 25 acota con margen amplio en vez de depender solo del
        # timeout-minutes de 150 del job, que dejaba una red externa lenta o
        # colgada consumir horas antes de que algo lo notara (Bloque 64). `set -o
        # pipefail` es obligatorio aquí: sin él, el código de salida 124 de
        # `timeout` se pierde detrás del de `tee` (casi siempre 0) y el paso se
        # reporta "success" aunque en realidad se cortó a mitad de la instalación
        # — exactamente lo que pasó en la primera versión de esta corrección.
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=30s 25m \
            bash .github/helper/install.sh 2>&1 | tee artifacts/nexora-financial/install.log
        env:
          DB: mariadb
          TYPE: server
          FRAPPE_USER: frappe
          FRAPPE_BRANCH: version-15
          PAYMENTS_BRANCH: version-15
      - name: Prepare NEXORA app in bench
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          ln -s "$GITHUB_WORKSPACE/nexora_app" apps/nexora
          ./env/bin/pip install -e apps/nexora 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/app-package.log"
          python "$GITHUB_WORKSPACE/scripts/register_nexora_app.py" sites/apps.txt
      - name: Install and verify NEXORA on clean MariaDB site
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          {
            bench --site test_site install-app nexora
            bench --site test_site migrate
            bench --site test_site list-apps
            bench --site test_site run-tests --app nexora --module nexora.tests.test_installation
          } 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/app-install.log"
      - name: Prove clean-site coexistence and rollback
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          {
            test -d "$GITHUB_WORKSPACE/erpnext/construcontrol"
            bench --site test_site execute erpnext.construcontrol.tests.runtime_smoke.run
            bench --site test_site uninstall-app nexora --yes
            apps="$(bench --site test_site list-apps)"
            printf '%s\n' "$apps"
            if printf '%s\n' "$apps" | awk 'NF {print $1}' | grep -qx nexora; then exit 1; fi
            printf '%s\n' "$apps" | awk 'NF {print $1}' | grep -qx erpnext
            bench --site test_site install-app nexora
            bench --site test_site migrate
            bench --site test_site run-tests --app nexora --module nexora.tests.test_installation
          } 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/coexistence-rollback.log"
      - name: Prove financial, correction, directory, contract, supplier, request and executive invariants with rollback on MariaDB
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          bench --site test_site run-tests --app nexora --module nexora.tests.test_fund_selector_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/fund-selector-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_financial_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/financial-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_remittances_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/remittances-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_guided_account_progressive_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/guided-account-progressive-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_guided_operation_correction_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/guided-operation-correction-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_ledger_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/ledger-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_evidence_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/evidence-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_directory_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/directory-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_contract_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/contract-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_purchase_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/purchase-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_purchase_request_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/purchase-request-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_quotation_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/quotation-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_dashboard_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/dashboard-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_executive_reporting_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/executive-reporting-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_filtered_snapshot_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/filtered-snapshot-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_budget_as_of_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/budget-as-of-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_weekly_close_canonical_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/weekly-close-v3-integration.log"
      - name: Prove progress evidence, budget enforcement, notifications, integrations audit, context360, conversational OS and WhatsApp channel invariants on MariaDB
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          bench --site test_site run-tests --app nexora --module nexora.tests.test_receipt_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/receipt-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_progress_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/progress-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_budget_commitment_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/budget-commitment-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_notifications_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/notifications-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_integrations_service_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/integrations-service-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_service_locked_permission_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/service-locked-permission-integration.log"
          # Causa raíz diagnosticada con acceso real a bench (no era un defecto de
          # permisos): `setUpClass` comparte `self.viewer`/`self.project` entre todos
          # los métodos de la clase y `FrappeTestCase` no hace rollback entre ellos;
          # el `User Permission` que crea `..._with_an_explicit_grant_...` (que
          # ordena alfabéticamente antes) quedaba vivo para
          # `..._without_a_grant_...`, que dejaba de poder reproducir el rechazo que
          # decía probar. Corregido retirando el `User Permission` al final de ese
          # test.
          bench --site test_site run-tests --app nexora --module nexora.tests.test_context360_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/context360-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_quality_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/quality-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_inventory_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/inventory-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_conversation_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/conversation-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_whatsapp_channel_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/whatsapp-channel-integration.log"
          bench --site test_site run-tests --app nexora --module nexora.tests.test_sap_integration_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/sap-integration-integration.log"
      - name: Prove the AI gateway reaches a real live provider (NXR-AI-0001, NXR-CNV-0001, NXR-UX-0009)
        shell: bash
        env:
          # Única prueba de todo el repositorio que hace una llamada de red real a
          # un proveedor de IA — el resto de intelligence/conversation se ejerce
          # con dobles de prueba deliberadamente (ver NIP_BLOQUE_6_CONVERSATIONAL_OS.md).
          # La propia clase se salta por completo si este secreto no está configurado.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          bench --site test_site run-tests --app nexora --module nexora.tests.test_intelligence_live_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/intelligence-live-integration.log"
      - name: Prove concurrent financial and directory locking with independent connections
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          bench --site test_site execute nexora.tests.concurrency_probe.run \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/concurrency.log"
          bench --site test_site execute nexora.tests.directory_concurrency_probe.run \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/directory-concurrency.log"
          bench --site test_site execute nexora.tests.contract_concurrency_probe.run \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/contract-concurrency.log"
      - name: Prove idempotent NEXORA staging data
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          {
            bench --site test_site set-config nexora_staging 1
            bench --site test_site execute nexora.financial.seeds.seed_demo_data
            bench --site test_site execute nexora.financial.seeds.seed_demo_data
            bench --site test_site execute nexora.financial.seeds.assert_staging_health
          } 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-financial/staging.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexora-financial-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/nexora-financial
          if-no-files-found: error
          retention-days: 30
