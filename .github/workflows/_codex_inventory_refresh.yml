name: NEXORA Temporary Inventory Refresh

on:
  push:
    branches:
      - codex/nexora-final-corrections-20260815

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate canonical inventory
        run: python3 scripts/generate_file_inventory.py

      - name: Commit generated inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/file_inventory.json
          if git diff --cached --quiet; then
            echo "Inventory already current"
            exit 0
          fi
          git commit -m "chore(nexora): refresh canonical file inventory"
          git push
