name: Temporary NEXORA smoke regex repair

on:
  push:
    branches: [nexora-fase2-fase3-entrega-final]
    paths:
      - .github/workflows/temp-smoke-regex-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexora-fase2-fase3-entrega-final
          fetch-depth: 0
      - name: Repair transferred regex and verify syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/nexora_browser_smoke.mjs")
          source = path.read_text(encoding="utf-8")
          broken = "inicie sesi[ooón para acceder"
          fixed = "inicie sesi[oó]n para acceder"
          if source.count(broken) != 1:
              raise SystemExit(f"Expected exactly one damaged regex, found {source.count(broken)}")
          path.write_text(source.replace(broken, fixed), encoding="utf-8")
          PY
          node --check scripts/nexora_browser_smoke.mjs
          git diff --check
      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/nexora_browser_smoke.mjs
          git commit -m "fix(ci): repair transferred smoke regex"
          git push origin HEAD:nexora-fase2-fase3-entrega-final
