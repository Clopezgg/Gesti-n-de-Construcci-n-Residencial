name: NEXORA app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - EXECUTION_STATE.md
      # La Constitución y su validador tienen que disparar este flujo: sin estas tres
      # rutas, un cambio que solo tocara el documento rector no ejecutaba la validación
      # que lo guarda, y la puerta quedaba abierta justo donde más importa.
      - NEXORA_CONSTITUTION.md
      - AGENTS.md
      - scripts/validate_nexora_constitution.py
      - nexora_app/**
      - scripts/validate_nexora_app.py
      - scripts/validate_nexora_financial_models.py
      - scripts/register_nexora_app.py
      - scripts/nexora_browser_smoke.mjs
      - Dockerfile.nexora
      - docker-compose.nexora.yml
      - deploy/nexora/**
      - deploy/ci/docker-compose.browser.yml
      - .github/workflows/nexora-app.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Validate NEXORA app, models, services and UI
        run: |
          set -euo pipefail
          python scripts/validate_nexora_constitution.py
          python scripts/validate_nexora_app.py
          python scripts/validate_nexora_financial_models.py
          PYTHONPATH=nexora_app python -m unittest discover -s nexora_app/nexora/tests -p 'test_*contract.py' -v
          PYTHONPATH=nexora_app python -m unittest nexora.tests.test_financial_core nexora.tests.test_evidence_core nexora.tests.test_directory_core -v
          node --check nexora_app/nexora/nexora/page/nexora_dashboard/nexora_dashboard.js
          node --check nexora_app/nexora/nexora/page/nexora_finance/nexora_finance.js
          node --check nexora_app/nexora/nexora/page/nexora_evidence/nexora_evidence.js
          node --check nexora_app/nexora/nexora/page/nexora_entities/nexora_entities.js
          node --check nexora_app/nexora/nexora/page/nexora_contracts/nexora_contracts.js
          node --check nexora_app/nexora/public/js/nexora.js
          node --check nexora_app/nexora/www/nexora-service-worker.js
          node --check scripts/nexora_browser_smoke.mjs
          node --check scripts/nexora_browser_support.mjs
          node --check scripts/nexora_browser_validators.mjs
          node --check scripts/nexora_browser_support.test.mjs
          node --test scripts/nexora_browser_support.test.mjs
          python -m compileall -q nexora_app/nexora scripts

  install-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Initialize runtime evidence
        run: mkdir -p artifacts/nexora-app
      - name: Install ERPNext test bench
        # Igual acotamiento que en nexora-financial.yml (Bloque 64): sin esto, una
        # red externa lenta o colgada consumía el timeout-minutes completo del job
        # (120 min) en vez de fallar rápido y con causa identificable. `pipefail`
        # es obligatorio: sin él, un `timeout` que corta el paso se reporta como
        # "success" porque el código de salida real queda detrás del de `tee`.
        run: |
          set -euo pipefail
          # 90m, no 45m: el propio PR #271 que introdujo el límite de 45m (Bloque
          # 112) volvió a fallar contra él minutos después de mergearse esa misma
          # corrida — exit 124 real a los 45m24s, mismo espejo `archive.ubuntu.com`
          # estancado, evidencia leída del log crudo (Bloque 119). El degradado de
          # hoy alcanzó hasta 1h22min37s en otra corrida de esta misma sesión — 45m
          # resultó insuficiente en la práctica. El job tiene 120m de presupuesto
          # total; 90m deja margen de sobra para el resto del paso.
          timeout --signal=INT --kill-after=30s 90m \
            bash .github/helper/install.sh 2>&1 | tee artifacts/nexora-app/bench-install.log
        env:
          DB: mariadb
          TYPE: server
          FRAPPE_USER: frappe
          FRAPPE_BRANCH: version-15
          PAYMENTS_BRANCH: version-15
      - name: Prepare NEXORA package
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          ln -s "$GITHUB_WORKSPACE/nexora_app" apps/nexora
          ./env/bin/pip install -e apps/nexora 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-app/package.log"
          python "$GITHUB_WORKSPACE/scripts/register_nexora_app.py" sites/apps.txt
      - name: Install and migrate NEXORA
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          {
            bench --site test_site install-app nexora
            bench --site test_site migrate
          } 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-app/install-migrate.log"
      - name: Verify fixtures workspace roles and coexistence
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          {
            bench --site test_site run-tests --app nexora --module nexora.tests.test_installation
            apps="$(bench --site test_site list-apps)"
            printf '%s\n' "$apps"
            printf '%s\n' "$apps" | awk 'NF {print $1}' | grep -qx erpnext
            printf '%s\n' "$apps" | awk 'NF {print $1}' | grep -qx nexora
            test -d "$GITHUB_WORKSPACE/erpnext/construcontrol"
          } 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-app/verification.log"
      - name: Uninstall NEXORA from clean site
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          {
            bench --site test_site uninstall-app nexora --yes
            apps="$(bench --site test_site list-apps)"
            printf '%s\n' "$apps"
            if printf '%s\n' "$apps" | awk 'NF {print $1}' | grep -qx nexora; then exit 1; fi
            printf '%s\n' "$apps" | awk 'NF {print $1}' | grep -qx erpnext
          } 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-app/uninstall.log"
      - name: Reinstall and verify NEXORA
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          {
            bench --site test_site install-app nexora
            bench --site test_site migrate
            bench --site test_site run-tests --app nexora --module nexora.tests.test_installation
          } 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-app/reinstall.log"
      - name: Seed twice and verify NEXORA staging data
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          {
            bench --site test_site set-config nexora_staging 1
            bench --site test_site execute nexora.financial.seeds.seed_demo_data
            bench --site test_site execute nexora.financial.seeds.seed_demo_data
            bench --site test_site execute nexora.financial.seeds.assert_staging_health
          } 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-app/staging.log"
      - name: Exercise the operational console against the real bench
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          # La suite existia y ningun workflow la ejecutaba: cubre ingreso, gasto,
          # correcciones y libro contra MariaDB real, que es donde un rechazo del
          # servidor aparece con traza completa en vez de un fallo opaco de navegador.
          bench --site test_site run-tests --app nexora \
            --module nexora.tests.test_operational_integration \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-app/operational-integration.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexora-app-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/nexora-app
          if-no-files-found: error
          retention-days: 30

  browser:
    name: Frappe real · escritorio · tableta · iPhone · PWA
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate browser and compose contracts
        run: |
          set -euo pipefail
          node --check scripts/nexora_browser_smoke.mjs
          ERPNEXT_VERSION=v15.117.0 \
            SITE_NAME=nexora-ui-ci \
            DB_NAME=_nexora_ui_ci \
            DB_PASSWORD=x \
            DB_ROOT_PASSWORD=x \
            ADMIN_PASSWORD=x \
            FRAPPE_ENCRYPTION_KEY=x \
            FRAPPE_EXTERNAL_URL=http://127.0.0.1:8080 \
            TZ=America/Tegucigalpa \
            GUNICORN_WORKERS=2 \
            GUNICORN_THREADS=4 \
            GUNICORN_TIMEOUT=120 \
            BACKUP_LOCAL_HOUR=2 \
            BACKUP_RETENTION_DAYS=14 \
            BACKUP_RUN_ON_START=false \
            NEXORA_ENVIRONMENT=staging \
            NEXORA_SEED_DEMO_DATA=false \
            BROWSER_PORT=8080 \
            docker compose -f docker-compose.nexora.yml -f deploy/ci/docker-compose.browser.yml config >/dev/null
      - name: Create isolated NEXORA environment
        shell: bash
        env:
          # NXR-CNV-0001/NXR-UX-0009: mismo secreto que ya usa nexora-financial.yml
          # para test_intelligence_live_integration.py — aquí solo llega a este
          # archivo de entorno efímero, nunca se imprime. docker-compose.nexora.yml
          # ya declara OPENAI_API_KEY: ${OPENAI_API_KEY:-} en x-app-environment;
          # sin este secreto, el backend simplemente no recibe credencial y
          # seed_live_ai_provider_for_ci()/la etapa de navegador se omiten solas.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          cat > .nexora-ui.env <<EOF
          ERPNEXT_VERSION=v15.117.0
          SITE_NAME=nexora-ui-ci
          DB_NAME=_nexora_ui_ci
          DB_PASSWORD=$(openssl rand -hex 18)
          DB_ROOT_PASSWORD=$(openssl rand -hex 18)
          ADMIN_PASSWORD=$(openssl rand -hex 18)
          FRAPPE_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')
          FRAPPE_EXTERNAL_URL=http://127.0.0.1:8080
          TZ=America/Tegucigalpa
          GUNICORN_WORKERS=2
          GUNICORN_THREADS=4
          GUNICORN_TIMEOUT=120
          BACKUP_LOCAL_HOUR=2
          BACKUP_RETENTION_DAYS=14
          BACKUP_RUN_ON_START=false
          NEXORA_ENVIRONMENT=staging
          NEXORA_SEED_DEMO_DATA=false
          BROWSER_PORT=8080
          OPENAI_API_KEY=${OPENAI_API_KEY}
          EOF
      - name: Build, seed and restart the real Frappe stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nexora-ui/browser
          compose=(docker compose --env-file .nexora-ui.env -f docker-compose.nexora.yml -f deploy/ci/docker-compose.browser.yml)
          "${compose[@]}" up -d --build
          services=(mariadb redis-cache redis-queue backend websocket queue-short queue-long scheduler frontend backup)
          for service in "${services[@]}"; do
            healthy=0
            for attempt in $(seq 1 120); do
              container="$("${compose[@]}" ps -q "$service")"
              state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              echo "$service attempt=$attempt state=$state" | tee -a artifacts/nexora-ui/health.log
              if [[ "$state" == "healthy" ]]; then healthy=1; break; fi
              if [[ "$state" == "unhealthy" || "$state" == "exited" || "$state" == "dead" ]]; then break; fi
              sleep 5
            done
            test "$healthy" = "1"
          done
          {
            "${compose[@]}" exec -T backend bench --site nexora-ui-ci set-config nexora_staging 1
            "${compose[@]}" exec -T backend bench --site nexora-ui-ci execute nexora.financial.seeds.seed_demo_data
            "${compose[@]}" exec -T backend bench --site nexora-ui-ci execute nexora.financial.seeds.seed_demo_data
            "${compose[@]}" exec -T backend bench --site nexora-ui-ci execute nexora.financial.seeds.assert_staging_health
            # NXR-CNV-0001/NXR-UX-0009: sin OPENAI_API_KEY el backend no recibe la
            # variable (docker-compose.nexora.yml la declara opcional) y esta
            # llamada se omite sola — nunca bloquea un entorno sin la credencial.
            "${compose[@]}" exec -T backend bench --site nexora-ui-ci execute nexora.intelligence.seeds.seed_live_ai_provider_for_ci
          } 2>&1 | tee artifacts/nexora-ui/staging.log
          "${compose[@]}" restart backend websocket queue-short queue-long scheduler frontend
          for service in backend websocket queue-short queue-long scheduler frontend; do
            healthy=0
            for attempt in $(seq 1 90); do
              container="$("${compose[@]}" ps -q "$service")"
              state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              echo "restart $service attempt=$attempt state=$state" | tee -a artifacts/nexora-ui/restart-health.log
              if [[ "$state" == "healthy" ]]; then healthy=1; break; fi
              if [[ "$state" == "unhealthy" || "$state" == "exited" || "$state" == "dead" ]]; then break; fi
              sleep 5
            done
            test "$healthy" = "1"
          done
          "${compose[@]}" exec -T backend bench --site nexora-ui-ci execute nexora.financial.seeds.assert_staging_health \
            2>&1 | tee artifacts/nexora-ui/post-restart-health.log
      - name: Validate desktop, iPhone WebKit and PWA
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .nexora-ui.env
          set +a
          timeout --signal=INT --kill-after=30s 10m \
            npm install --no-save playwright@1.52.0 2>&1 | tee artifacts/nexora-ui/playwright-install.log
          # 40m, no 20m: el espejo `azure.archive.ubuntu.com` de este paso (las
          # dependencias del sistema de WebKit vía `apt-get`) se observó real y
          # repetidamente entre 19min54s y 1h22min para el mismo payload de ~110 MB
          # en varias corridas reales de esta sesión — 20m cortaba la descarga real
          # a mitad de camino, no una instalación colgada. El job tiene 180m de
          # presupuesto total: sigue fallando rápido frente a un colgado real, solo
          # deja de cortar una descarga externa lenta pero que sí avanza.
          timeout --signal=INT --kill-after=30s 40m \
            npx playwright install --with-deps chromium webkit 2>&1 | tee artifacts/nexora-ui/browser-install.log
          NEXORA_BASE_URL=http://127.0.0.1:8080 \
            BROWSER_ARTIFACT_DIR=artifacts/nexora-ui/browser \
            timeout --signal=INT --kill-after=30s 50m \
            node scripts/nexora_browser_smoke.mjs 2>&1 | tee artifacts/nexora-ui/browser.log
      - name: Capture runtime evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/nexora-ui
          docker compose --env-file .nexora-ui.env -f docker-compose.nexora.yml -f deploy/ci/docker-compose.browser.yml ps -a \
            > artifacts/nexora-ui/compose-ps.txt 2>&1 || true
          docker compose --env-file .nexora-ui.env -f docker-compose.nexora.yml -f deploy/ci/docker-compose.browser.yml logs --no-color --tail=1000 \
            > artifacts/nexora-ui/compose.log 2>&1 || true
          git rev-parse HEAD > artifacts/nexora-ui/head.sha
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexora-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/nexora-ui
          if-no-files-found: error
          retention-days: 30
      - name: Remove isolated NEXORA environment
        if: always()
        run: |
          docker compose --env-file .nexora-ui.env -f docker-compose.nexora.yml -f deploy/ci/docker-compose.browser.yml down --remove-orphans -v || true
          rm -f .nexora-ui.env
      # El recorrido ya imprime la causa al final de su paso, pero después vienen la
      # subida del artefacto y el apagado de los contenedores: cien lineas de ruido que
      # empujan el motivo fuera de la ventana que devuelve el lector de registros. Este
      # paso lo repite de ultimo, cuando ya no queda nada detras.
      - name: Repetir la causa del fallo al final del registro
        if: failure()
        run: |
          set -euo pipefail
          # La ruta es la misma que recibe el recorrido en BROWSER_ARTIFACT_DIR: escribir
          # otra aqui hacia que este paso dijera "fallo antes de arrancar" sobre un
          # informe que si existia. Un diagnostico que miente es peor que no tenerlo.
          report=artifacts/nexora-ui/browser/nexora-browser-report.json
          echo "=============================================="
          echo "[nexora] CAUSA DEL FALLO DEL RECORRIDO"
          echo "=============================================="
          if [ -f "$report" ]; then
            python3 -c "import json,sys; data=json.load(open(sys.argv[1])); print(data.get('error_message') or data.get('error') or 'el informe no registro ningun error')" "$report"
          else
            echo "No se encontro el informe en $report."
            echo "Contenido de artifacts/nexora-ui:"
            ls -R artifacts/nexora-ui 2>&1 | head -40
          fi
          echo "=============================================="
