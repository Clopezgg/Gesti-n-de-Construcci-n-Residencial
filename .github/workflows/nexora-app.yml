name: NEXORA app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - EXECUTION_STATE.md
      - nexora_app/**
      - scripts/validate_nexora_app.py
      - scripts/validate_nexora_financial_models.py
      - scripts/register_nexora_app.py
      - scripts/nexora_browser_smoke.mjs
      - Dockerfile.nexora
      - docker-compose.nexora.yml
      - deploy/nexora/**
      - deploy/ci/docker-compose.browser.yml
      - .github/workflows/nexora-app.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Validate NEXORA app, models, services and UI
        run: |
          set -euo pipefail
          python scripts/validate_nexora_app.py
          python scripts/validate_nexora_financial_models.py
          PYTHONPATH=nexora_app python -m unittest discover -s nexora_app/nexora/tests -p 'test_*contract.py' -v
          PYTHONPATH=nexora_app python -m unittest nexora.tests.test_financial_core nexora.tests.test_evidence_core nexora.tests.test_directory_core -v
          node --check nexora_app/nexora/nexora/page/nexora-dashboard/nexora-dashboard.js
          node --check nexora_app/nexora/nexora/page/nexora_finance/nexora_finance.js
          node --check nexora_app/nexora/nexora/page/nexora_evidence/nexora_evidence.js
          node --check nexora_app/nexora/nexora/page/nexora_entities/nexora_entities.js
          node --check nexora_app/nexora/nexora/page/nexora_contracts/nexora_contracts.js
          node --check nexora_app/nexora/public/js/nexora.js
          node --check nexora_app/nexora/www/nexora-service-worker.js
          node --check scripts/nexora_browser_smoke.mjs
          python -m compileall -q nexora_app/nexora scripts

  install-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Initialize runtime evidence
        run: mkdir -p artifacts/nexora-app
      - name: Install ERPNext test bench
        run: bash .github/helper/install.sh 2>&1 | tee artifacts/nexora-app/bench-install.log
        env:
          DB: mariadb
          TYPE: server
          FRAPPE_USER: frappe
          FRAPPE_BRANCH: version-15
          PAYMENTS_BRANCH: version-15
      - name: Prepare NEXORA package
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          ln -s "$GITHUB_WORKSPACE/nexora_app" apps/nexora
          ./env/bin/pip install -e apps/nexora 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-app/package.log"
          python "$GITHUB_WORKSPACE/scripts/register_nexora_app.py" sites/apps.txt
      - name: Install and migrate NEXORA
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          {
            bench --site test_site install-app nexora
            bench --site test_site migrate
          } 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-app/install-migrate.log"
      - name: Verify fixtures workspace roles and coexistence
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          {
            bench --site test_site run-tests --app nexora --module nexora.tests.test_installation
            apps="$(bench --site test_site list-apps)"
            printf '%s\n' "$apps"
            printf '%s\n' "$apps" | awk 'NF {print $1}' | grep -qx erpnext
            printf '%s\n' "$apps" | awk 'NF {print $1}' | grep -qx nexora
            test -d "$GITHUB_WORKSPACE/erpnext/construcontrol"
          } 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-app/verification.log"
      - name: Uninstall NEXORA from clean site
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          {
            bench --site test_site uninstall-app nexora --yes
            apps="$(bench --site test_site list-apps)"
            printf '%s\n' "$apps"
            if printf '%s\n' "$apps" | awk 'NF {print $1}' | grep -qx nexora; then exit 1; fi
            printf '%s\n' "$apps" | awk 'NF {print $1}' | grep -qx erpnext
          } 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-app/uninstall.log"
      - name: Reinstall and verify NEXORA
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          {
            bench --site test_site install-app nexora
            bench --site test_site migrate
            bench --site test_site run-tests --app nexora --module nexora.tests.test_installation
          } 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-app/reinstall.log"
      - name: Seed twice and verify NEXORA staging data
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          {
            bench --site test_site set-config nexora_staging 1
            bench --site test_site execute nexora.financial.seeds.seed_demo_data
            bench --site test_site execute nexora.financial.seeds.seed_demo_data
            bench --site test_site execute nexora.financial.seeds.assert_staging_health
          } 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/nexora-app/staging.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexora-app-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/nexora-app
          if-no-files-found: error
          retention-days: 30

  browser:
    name: Frappe real · escritorio · iPhone · PWA
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate browser and compose contracts
        run: |
          set -euo pipefail
          node --check scripts/nexora_browser_smoke.mjs
          ERPNEXT_VERSION=v15.117.0 \
            SITE_NAME=nexora-ui-ci \
            DB_NAME=_nexora_ui_ci \
            DB_PASSWORD=x \
            DB_ROOT_PASSWORD=x \
            ADMIN_PASSWORD=x \
            FRAPPE_ENCRYPTION_KEY=x \
            FRAPPE_EXTERNAL_URL=http://127.0.0.1:8080 \
            TZ=America/Tegucigalpa \
            GUNICORN_WORKERS=2 \
            GUNICORN_THREADS=4 \
            GUNICORN_TIMEOUT=120 \
            BACKUP_LOCAL_HOUR=2 \
            BACKUP_RETENTION_DAYS=14 \
            BACKUP_RUN_ON_START=false \
            NEXORA_ENVIRONMENT=staging \
            NEXORA_SEED_DEMO_DATA=false \
            BROWSER_PORT=8080 \
            docker compose -f docker-compose.nexora.yml -f deploy/ci/docker-compose.browser.yml config >/dev/null
      - name: Create isolated NEXORA environment
        shell: bash
        run: |
          set -euo pipefail
          cat > .nexora-ui.env <<EOF
          ERPNEXT_VERSION=v15.117.0
          SITE_NAME=nexora-ui-ci
          DB_NAME=_nexora_ui_ci
          DB_PASSWORD=$(openssl rand -hex 18)
          DB_ROOT_PASSWORD=$(openssl rand -hex 18)
          ADMIN_PASSWORD=$(openssl rand -hex 18)
          FRAPPE_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')
          FRAPPE_EXTERNAL_URL=http://127.0.0.1:8080
          TZ=America/Tegucigalpa
          GUNICORN_WORKERS=2
          GUNICORN_THREADS=4
          GUNICORN_TIMEOUT=120
          BACKUP_LOCAL_HOUR=2
          BACKUP_RETENTION_DAYS=14
          BACKUP_RUN_ON_START=false
          NEXORA_ENVIRONMENT=staging
          NEXORA_SEED_DEMO_DATA=false
          BROWSER_PORT=8080
          EOF
      - name: Build, seed and restart the real Frappe stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nexora-ui/browser
          compose=(docker compose --env-file .nexora-ui.env -f docker-compose.nexora.yml -f deploy/ci/docker-compose.browser.yml)
          "${compose[@]}" up -d --build
          services=(mariadb redis-cache redis-queue backend websocket queue-short queue-long scheduler frontend backup)
          for service in "${services[@]}"; do
            healthy=0
            for attempt in $(seq 1 120); do
              container="$("${compose[@]}" ps -q "$service")"
              state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              echo "$service attempt=$attempt state=$state" | tee -a artifacts/nexora-ui/health.log
              if [[ "$state" == "healthy" ]]; then healthy=1; break; fi
              if [[ "$state" == "unhealthy" || "$state" == "exited" || "$state" == "dead" ]]; then break; fi
              sleep 5
            done
            test "$healthy" = "1"
          done
          {
            "${compose[@]}" exec -T backend bench --site nexora-ui-ci set-config nexora_staging 1
            "${compose[@]}" exec -T backend bench --site nexora-ui-ci execute nexora.financial.seeds.seed_demo_data
            "${compose[@]}" exec -T backend bench --site nexora-ui-ci execute nexora.financial.seeds.seed_demo_data
            "${compose[@]}" exec -T backend bench --site nexora-ui-ci execute nexora.financial.seeds.assert_staging_health
          } 2>&1 | tee artifacts/nexora-ui/staging.log
          "${compose[@]}" restart backend websocket queue-short queue-long scheduler frontend
          for service in backend websocket queue-short queue-long scheduler frontend; do
            healthy=0
            for attempt in $(seq 1 90); do
              container="$("${compose[@]}" ps -q "$service")"
              state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              echo "restart $service attempt=$attempt state=$state" | tee -a artifacts/nexora-ui/restart-health.log
              if [[ "$state" == "healthy" ]]; then healthy=1; break; fi
              if [[ "$state" == "unhealthy" || "$state" == "exited" || "$state" == "dead" ]]; then break; fi
              sleep 5
            done
            test "$healthy" = "1"
          done
          "${compose[@]}" exec -T backend bench --site nexora-ui-ci execute nexora.financial.seeds.assert_staging_health \
            2>&1 | tee artifacts/nexora-ui/post-restart-health.log
      - name: Validate desktop, iPhone WebKit and PWA
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .nexora-ui.env
          set +a
          timeout --signal=INT --kill-after=30s 10m \
            npm install --no-save playwright@1.52.0 2>&1 | tee artifacts/nexora-ui/playwright-install.log
          timeout --signal=INT --kill-after=30s 20m \
            npx playwright install --with-deps chromium webkit 2>&1 | tee artifacts/nexora-ui/browser-install.log
          NEXORA_BASE_URL=http://127.0.0.1:8080 \
            BROWSER_ARTIFACT_DIR=artifacts/nexora-ui/browser \
            timeout --signal=INT --kill-after=30s 50m \
            node scripts/nexora_browser_smoke.mjs 2>&1 | tee artifacts/nexora-ui/browser.log
      - name: Capture runtime evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/nexora-ui
          docker compose --env-file .nexora-ui.env -f docker-compose.nexora.yml -f deploy/ci/docker-compose.browser.yml ps -a \
            > artifacts/nexora-ui/compose-ps.txt 2>&1 || true
          docker compose --env-file .nexora-ui.env -f docker-compose.nexora.yml -f deploy/ci/docker-compose.browser.yml logs --no-color --tail=1000 \
            > artifacts/nexora-ui/compose.log 2>&1 || true
          git rev-parse HEAD > artifacts/nexora-ui/head.sha
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexora-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/nexora-ui
          if-no-files-found: error
          retention-days: 30
      - name: Remove isolated NEXORA environment
        if: always()
        run: |
          docker compose --env-file .nexora-ui.env -f docker-compose.nexora.yml -f deploy/ci/docker-compose.browser.yml down --remove-orphans -v || true
          rm -f .nexora-ui.env
