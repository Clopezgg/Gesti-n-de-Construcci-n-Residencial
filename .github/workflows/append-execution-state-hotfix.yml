name: Append temporary execution-state record

on:
  push:
    branches:
      - fix/nexora-sap-http-error-header

permissions:
  contents: write

jobs:
  append-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append execution state and remove helper
        shell: bash
        env:
          BRANCH: fix/nexora-sap-http-error-header
        run: |
          set -euo pipefail
          marker='## Bloque — corrección de fallo SAP HTTP sin response headers en CI'
          if ! grep -Fq "$marker" EXECUTION_STATE.md; then
            cat >> EXECUTION_STATE.md <<'EOF'

## Bloque — corrección de fallo SAP HTTP sin response headers en CI

- Fecha: 2026-08-22
- Rama de trabajo: `fix/nexora-sap-http-error-header`
- Base verificada: `main` en `7ef07002e76c0f2b1a2c0dfdb0b91ebf399a0fe9`
- Causa raíz confirmada en el artefacto del job `mariadb` del workflow `NEXORA financial invariants` (run `32553322048`): un caso negativo de `HTTPError` sin cabeceras (`exc.headers is None`) provocaba `AttributeError` al ejecutar `exc.headers.get("Content-Encoding")`, enmascarando el HTTP 401 real y abortando el job.
- Corrección aplicada en `nexora_app/nexora/integrations/sap.py`: los tres puntos de decodificación de cuerpos de error usan `(exc.headers or {}).get("Content-Encoding")`, preservando el error real cuando no existen cabeceras.
- El cambio corrige la causa primaria del check `mariadb`; `NEXORA Predeploy Certification` y `Predeploy certification receipt` eran fallos derivados del mismo gate rojo.
- Evidencia negativa previa: `sap-integration-integration.log` registró 55 pruebas, 1 error, exactamente `AttributeError: 'NoneType' object has no attribute 'get'` en `test_a_non_retryable_client_error_is_never_retried`.
- La suite existente ya contiene la prueba negativa que reproduce el defecto y se reutilizará en CI después del cambio.
- Producción, AWS, Coolify, DNS, secretos, volúmenes y datos reales: **NO MODIFICADOS**.
- Estado antes del merge: corrección publicada en rama; pendiente de CI y publicación en `main`.
EOF
          fi
          rm -f .github/workflows/append-execution-state-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EXECUTION_STATE.md .github/workflows/append-execution-state-hotfix.yml
          git commit -m 'chore(nexora): record SAP CI hotfix execution state'
          git push origin "HEAD:${BRANCH}"
