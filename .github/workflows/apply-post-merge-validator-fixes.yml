name: Apply post-merge validator fixes

on:
  push:
    branches:
      - hotfix/main-post-merge-ci
    paths:
      - .github/workflows/apply-post-merge-validator-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/main-post-merge-ci
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Correct validators and official state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('.')

          operational = root / 'scripts/validate_nexora_operational_acceptance.py'
          text = operational.read_text(encoding='utf-8')
          text = text.replace(
              'rows = re.findall(r"\\|\\s*(NXR-[A-Z]+-\\d+)\\s*\\|([^\\n]+)", text)',
              'rows = re.findall(r"\\|\\s*`?(NXR-[A-Z]+-\\d{4})`?\\s*\\|([^\\n]+)", text)',
          )
          text = text.replace(
              'match = re.search(r"\\|\\s*(NXR-[A-Z]+-\\d+)\\s*\\|", line)',
              'match = re.search(r"\\|\\s*`?(NXR-[A-Z]+-\\d{4})`?\\s*\\|", line)',
          )
          operational.write_text(text, encoding='utf-8')

          completion = root / 'scripts/validate_nexora_completion.py'
          completion.write_text('''#!/usr/bin/env python3
          """NEXORA — auditor de certificación integral (Bloque 19).

          Verifica que los 166 requisitos de la matriz tengan un estado terminal y
          que su bloque propietario aparezca certificado con un SHA completo en la
          tabla oficial de EXECUTION_STATE.md.
          """

          from __future__ import annotations

          import re
          import sys
          from pathlib import Path
          from typing import Any

          REPO_ROOT = Path(__file__).resolve().parents[1]
          MATRIX_PATH = REPO_ROOT / "docs/nexora/MATRIZ_REQUISITOS.md"
          STATE_PATH = REPO_ROOT / "EXECUTION_STATE.md"
          TERMINAL_STATES = {
              "IMPLEMENTADO Y VALIDADO",
              "OBSOLETO JUSTIFICADO",
              "NO APLICA JUSTIFICADO",
          }
          REQUIREMENT_RE = re.compile(r"^NXR-[A-Z]+-\\d{4}$")
          SHA_RE = re.compile(r"`([0-9a-f]{40})`")


          def split_row(line: str) -> list[str]:
              raw = line.strip().strip("|")
              cells = re.split(r"(?<!\\\\)\\|", raw)
              return [cell.strip().replace("\\\\|", "|") for cell in cells]


          def parse_matrix() -> dict[str, dict[str, Any]]:
              if not MATRIX_PATH.is_file():
                  raise FileNotFoundError(MATRIX_PATH)
              header: list[str] | None = None
              requirements: dict[str, dict[str, Any]] = {}
              for line in MATRIX_PATH.read_text(encoding="utf-8").splitlines():
                  if line.startswith("| ID | Título |"):
                      header = split_row(line)
                      continue
                  if not header or not line.startswith("| `NXR-"):
                      continue
                  values = split_row(line)
                  if len(values) != len(header):
                      raise ValueError(
                          f"Requirement row has {len(values)} cells; expected {len(header)}: {line[:100]}"
                      )
                  record = dict(zip(header, values, strict=True))
                  requirement_id = record["ID"].strip("`")
                  if not REQUIREMENT_RE.fullmatch(requirement_id):
                      raise ValueError(f"Invalid requirement ID: {requirement_id}")
                  requirements[requirement_id] = {
                      "status": record["Estado"],
                      "block": record["Propietario"].upper(),
                      "evidence": False,
                  }
              return requirements


          def expand_block_cell(value: str) -> list[int]:
              normalized = value.replace("*", "").replace("`", "").strip()
              match = re.fullmatch(r"(\\d+)(?:\\s*[–-]\\s*(\\d+))?", normalized)
              if not match:
                  return []
              start = int(match.group(1))
              end = int(match.group(2) or start)
              return list(range(start, end + 1))


          def parse_state() -> dict[str, str]:
              if not STATE_PATH.is_file():
                  raise FileNotFoundError(STATE_PATH)
              header: list[str] | None = None
              blocks: dict[str, str] = {}
              for line in STATE_PATH.read_text(encoding="utf-8").splitlines():
                  cells = split_row(line) if line.startswith("|") else []
                  if cells and cells[0].strip() == "Bloque" and "Estado" in cells:
                      header = cells
                      continue
                  if not header or not cells or len(cells) != len(header):
                      continue
                  record = dict(zip(header, cells, strict=True))
                  status = record["Estado"].replace("*", "").strip()
                  if status not in TERMINAL_STATES:
                      continue
                  sha_match = SHA_RE.search(record["SHA funcional certificado"])
                  if not sha_match:
                      continue
                  for number in expand_block_cell(record["Bloque"]):
                      blocks[f"BLOQUE {number}"] = sha_match.group(1)
              return blocks


          def check_requirements(
              requirements: dict[str, dict[str, Any]], blocks: dict[str, str]
          ) -> dict[str, list[str]]:
              results: dict[str, list[str]] = {"passed": [], "failed": []}
              for requirement_id, info in requirements.items():
                  block = info["block"]
                  if info["status"] in TERMINAL_STATES and block in blocks:
                      info["evidence"] = True
                      info["sha"] = blocks[block]
                      results["passed"].append(requirement_id)
                  else:
                      results["failed"].append(requirement_id)
              return results


          def main() -> int:
              print("=" * 60)
              print("NEXORA — Auditor de certificación integral")
              print("=" * 60)
              try:
                  requirements = parse_matrix()
                  blocks = parse_state()
              except (FileNotFoundError, ValueError) as exc:
                  print(f"ERROR: {exc}")
                  return 1

              print(f"\\nRequisitos encontrados: {len(requirements)}")
              print(f"Bloques certificados: {len(blocks)}")
              results = check_requirements(requirements, blocks)
              passed = len(results["passed"])
              failed = len(results["failed"])
              total = passed + failed

              structural_errors: list[str] = []
              if len(requirements) != 166:
                  structural_errors.append(
                      f"Se esperaban 166 requisitos y se encontraron {len(requirements)}."
                  )
              missing_blocks = [
                  f"BLOQUE {number}" for number in range(21) if f"BLOQUE {number}" not in blocks
              ]
              if missing_blocks:
                  structural_errors.append(
                      f"Bloques sin certificación terminal: {', '.join(missing_blocks)}"
                  )

              print(f"\\nResultados: {passed}/{total} aprobados, {failed}/{total} pendientes")
              if failed:
                  print("\\nRequisitos sin evidencia completa:")
                  for requirement_id in results["failed"]:
                      info = requirements[requirement_id]
                      print(f"  {requirement_id} [{info['status']}] - {info['block']}")
              for error in structural_errors:
                  print(f"ERROR: {error}")

              coverage = 100 * passed / total if total else 0
              print(f"\\nCobertura: {passed}/{total} ({coverage:.1f}%)")
              return 0 if not failed and not structural_errors else 1


          if __name__ == "__main__":
              sys.exit(main())
          '''.replace('          ', ''), encoding='utf-8')

          state_path = root / 'EXECUTION_STATE.md'
          state_lines = state_path.read_text(encoding='utf-8').splitlines()
          output: list[str] = []
          pr15_added = False
          integration_added = False
          for line in state_lines:
              if line.startswith('- PR #14:'):
                  output.append(line)
                  output.append(
                      '- PR #15: fusionado mediante squash en `main`; árbol funcional validado en '
                      '`37d5d996b16871b30b498e19bd44cb08e791d0cc` e integrado mediante '
                      '`718633009014234fcb183d3c33695f238871e056`.'
                  )
                  pr15_added = True
                  continue
              if line.startswith('- HEAD de `main` verificado:'):
                  output.append(
                      '- HEAD inicial de `main`: `b65f7c119b5b15620ae312d11cb3eb3447b25b86`'
                  )
                  continue
              if line.startswith('- SHA funcional del lote 1 de la Fase 1:'):
                  output.append(line)
                  output.append(
                      '- Integración final NEXORA certificada: '
                      '`718633009014234fcb183d3c33695f238871e056`'
                  )
                  integration_added = True
                  continue
              if re.match(r"^\\|\\s*11 — Buscador y dashboard", line):
                  output.append(
                      '| 11 — Buscador y dashboard | **IMPLEMENTADO Y VALIDADO** | '
                      '`37d5d996b16871b30b498e19bd44cb08e791d0cc` | — |'
                  )
                  continue
              if re.match(r"^\\|\\s*18 — Identidad, UX, iPhone, PWA", line):
                  output.append(
                      '| 18 — Identidad, UX, iPhone, PWA | **IMPLEMENTADO Y VALIDADO** | '
                      '`37d5d996b16871b30b498e19bd44cb08e791d0cc` | — |'
                  )
                  continue
              output.append(line)
          if not pr15_added or not integration_added:
              raise SystemExit('Expected EXECUTION_STATE anchors were not found')
          state_path.write_text('\n'.join(output) + '\n', encoding='utf-8')

          live_progress = {
              'schema_version': 1,
              'agent_status': 'validated',
              'phase': 'Fases 2 y 3 — entrega final NEXORA',
              'task': 'Mantener main como fuente única de verdad y validar cada integración antes de publicar',
              'detail': (
                  'PR #15 fusionado. Escritorio, iPhone WebKit, PWA, instalación, rollback, '
                  'gobierno, finanzas y producción fueron validados sobre el árbol funcional '
                  '37d5d996b16871b30b498e19bd44cb08e791d0cc e integrado en main mediante '
                  '718633009014234fcb183d3c33695f238871e056.'
              ),
              'started_at': '2026-07-26T08:00:00-06:00',
              'last_update': '2026-07-26T17:39:39-06:00',
              'tests': [
                  'NEXORA app: contratos, instalación, rollback, escritorio, iPhone WebKit y PWA aprobados',
                  'NEXORA financial invariants: MariaDB, concurrencia, rollback e idempotencia aprobados',
                  'NEXORA governance, Linters, Patch y producción aprobados en el SHA funcional',
                  'PR #15 fusionado sin bypass después de validar el mismo SHA funcional',
              ],
              'events': [
                  {
                      'time': '2026-07-26T17:39:39-06:00',
                      'type': 'final_integration',
                      'status': 'validated',
                      'message': (
                          'PR #15 fusionado en main mediante '
                          '718633009014234fcb183d3c33695f238871e056.'
                      ),
                  }
              ],
              'blocking_issue': None,
          }
          (root / 'docs/nexora/LIVE_PROGRESS.json').write_text(
              json.dumps(live_progress, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          rm .github/workflows/apply-post-merge-validator-fixes.yml

          python -m pip install pre-commit==3.8.0
          set +e
          pre-commit run --files \
            .github/workflows/nexora-governance.yml \
            .github/workflows/nexora-financial.yml \
            .github/workflows/linters.yml \
            .github/workflows/nexora-final-delivery.yml \
            scripts/validate_nexora_operational_acceptance.py \
            scripts/validate_nexora_completion.py \
            EXECUTION_STATE.md \
            docs/nexora/LIVE_PROGRESS.json
          first_status=$?
          set -e
          if [[ "$first_status" != "0" ]]; then
            pre-commit run --files \
              .github/workflows/nexora-governance.yml \
              .github/workflows/nexora-financial.yml \
              .github/workflows/linters.yml \
              .github/workflows/nexora-final-delivery.yml \
              scripts/validate_nexora_operational_acceptance.py \
              scripts/validate_nexora_completion.py \
              EXECUTION_STATE.md \
              docs/nexora/LIVE_PROGRESS.json
          fi

          python scripts/generate_file_inventory.py
          python scripts/validate_nexora_governance.py
          python scripts/validate_nexora_operational_acceptance.py
          python scripts/validate_nexora_completion.py
          python -m py_compile \
            scripts/validate_nexora_operational_acceptance.py \
            scripts/validate_nexora_completion.py

      - name: Commit complete hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): stabilize post-merge validation contracts"
          git push origin HEAD:hotfix/main-post-merge-ci
