name: Nexora Release Candidate

on:
  workflow_dispatch:

jobs:
  release-candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure scripts executable
        run: chmod +x ops/agents/scripts/*.sh

      - name: Run final audit
        run: bash ops/agents/scripts/final_audit.sh

      - name: Build release candidate
        run: bash ops/agents/scripts/build_release_candidate.sh

      - name: Upload RC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-release-candidate-artifacts
          path: |
            ops/agents/reports
            ops/agents/release
            ops/agents/state
