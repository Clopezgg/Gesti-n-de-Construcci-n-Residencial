name: NEXORA governance

on:
  push:
    branches: [main]
    paths:
      - EXECUTION_STATE.md
      - docs/nexora/**
      - docs/architecture/file_inventory.json
      - scripts/generate_file_inventory.py
      - scripts/validate_nexora_governance.py
      - .github/workflows/nexora-governance.yml
  pull_request:
    branches: [main]
    paths:
      - EXECUTION_STATE.md
      - docs/nexora/**
      - docs/architecture/file_inventory.json
      - scripts/generate_file_inventory.py
      - scripts/validate_nexora_governance.py
      - .github/workflows/nexora-governance.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate executable governance
        env:
          EXPECTED_MAIN_HEAD: ${{ github.event_name == 'push' && (github.event.before || '') || '' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/nexora-governance
          git fetch origin main
          python scripts/validate_nexora_governance.py \
            --expected-main-head "$EXPECTED_MAIN_HEAD" \
            2>&1 | tee artifacts/nexora-governance/validation.log
      - name: Compile governance validators
        run: |
          python -m py_compile \
            scripts/generate_file_inventory.py \
            scripts/validate_nexora_governance.py
      - name: Verify canonical repository inventory
        run: |
          python scripts/generate_file_inventory.py
          git diff --exit-code -- docs/architecture/file_inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexora-governance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/nexora-governance
            docs/architecture/file_inventory.json
          if-no-files-found: error
          retention-days: 7
