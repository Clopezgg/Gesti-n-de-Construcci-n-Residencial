name: NEXORA temporary working copy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build working copy archive
        run: tar --exclude='./.git' --exclude='./.github/workflows/nexora-working-copy-temporary.yml' -czf /tmp/nexora-working-copy.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-working-copy-${{ github.event.pull_request.head.sha }}
          path: /tmp/nexora-working-copy.tar.gz
          retention-days: 1
