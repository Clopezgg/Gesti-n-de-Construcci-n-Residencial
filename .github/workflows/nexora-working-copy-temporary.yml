name: NEXORA temporary working copy

on:
  push:
    branches:
      - feature/nexora-executive-dashboard-reporting-rebuild

permissions:
  contents: read

jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build working copy archive
        run: tar -czf /tmp/nexora-working-copy.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-working-copy-${{ github.sha }}
          path: /tmp/nexora-working-copy.tar.gz
          retention-days: 1
