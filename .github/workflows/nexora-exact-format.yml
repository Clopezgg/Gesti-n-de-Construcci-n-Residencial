name: NEXORA exact formatter

on:
  push:
    branches:
      - nexora-fase2-fase3-entrega-final
    paths:
      - .github/workflows/nexora-exact-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: nexora-fase2-fase3-entrega-final
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply repository Prettier version
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@2.7.1 --write \
            scripts/nexora_browser_smoke.mjs \
            nexora_app/nexora/nexora/page/nexora_finance/nexora_finance.js
          node --check scripts/nexora_browser_smoke.mjs
          node --check nexora_app/nexora/nexora/page/nexora_finance/nexora_finance.js

      - name: Commit formatted files and remove formatter
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/nexora-exact-format.yml
          printf '%s\n' "Exact Prettier 2.7.1 formatting completed." > .ci-format-complete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/nexora_browser_smoke.mjs \
            nexora_app/nexora/nexora/page/nexora_finance/nexora_finance.js \
            .github/workflows/nexora-exact-format.yml \
            .ci-format-complete
          git commit -m "fix(ci): apply exact Prettier formatting"
          git push origin HEAD:nexora-fase2-fase3-entrega-final
