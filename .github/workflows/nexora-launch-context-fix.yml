name: NEXORA launch context fix

on:
  push:
    branches:
      - nexora-fase2-fase3-entrega-final
    paths:
      - .github/workflows/nexora-launch-context-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: nexora-fase2-fase3-entrega-final
          fetch-depth: 0

      - name: Restore canonical launch context name
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("nexora_app/nexora/nexora/page/nexora_finance/nexora_finance.js")
          text = path.read_text(encoding="utf-8")
          old = '''\tasync function applyLaunchContext(context) {
          \t\t$(page.body).find(".nxr-source-create").removeClass("nxr-card-highlight");
          \t\tif (context.project) {
          \t\t\tawait project.set_value(context.project);
          \t\t}
          \t\tif (context.action === "expense") {'''
          new = '''\tasync function applyLaunchContext(launchContext) {
          \t\t$(page.body).find(".nxr-source-create").removeClass("nxr-card-highlight");
          \t\tif (launchContext.project) {
          \t\t\tawait project.set_value(launchContext.project);
          \t\t}
          \t\tif (launchContext.action === "expense") {'''
          if old not in text:
              raise SystemExit("Expected launch context block was not found")
          text = text.replace(old, new, 1)
          text = text.replace('if (context.action === "income") {', 'if (launchContext.action === "income") {', 1)
          path.write_text(text, encoding="utf-8")
          PY
          npx --yes prettier@2.7.1 --write nexora_app/nexora/nexora/page/nexora_finance/nexora_finance.js
          node --check nexora_app/nexora/nexora/page/nexora_finance/nexora_finance.js
          grep -F 'launchContext.action === "income"' nexora_app/nexora/nexora/page/nexora_finance/nexora_finance.js

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/nexora-launch-context-fix.yml
          printf '%s\n' "Canonical launch context restored." > .ci-launch-context-complete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexora_app/nexora/nexora/page/nexora_finance/nexora_finance.js \
            .github/workflows/nexora-launch-context-fix.yml \
            .ci-launch-context-complete
          git commit -m "fix(ui): preserve canonical finance launch context"
          git push origin HEAD:nexora-fase2-fase3-entrega-final
