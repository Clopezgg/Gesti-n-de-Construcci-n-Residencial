name: Temporary NEXORA smoke indent repair

on:
  push:
    branches: [nexora-fase2-fase3-entrega-final]
    paths:
      - .github/workflows/temp-smoke-indent-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexora-fase2-fase3-entrega-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Repair Prettier indentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/nexora_browser_smoke.mjs")
          source = path.read_text(encoding="utf-8")
          broken = "\n   { timeout: 120_000 }\n  );\n  const state = await page.evaluate"
          fixed = "\n    { timeout: 120_000 }\n  );\n  const state = await page.evaluate"
          if source.count(broken) != 1:
              raise SystemExit(f"Expected one indentation defect, found {source.count(broken)}")
          path.write_text(source.replace(broken, fixed), encoding="utf-8")
          PY
          node --check scripts/nexora_browser_smoke.mjs
          npx --yes prettier@2.7.1 --check scripts/nexora_browser_smoke.mjs
          git diff --check
      - name: Commit formatted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/nexora_browser_smoke.mjs
          git commit -m "style(ci): fix smoke script indentation"
          git push origin HEAD:nexora-fase2-fase3-entrega-final
