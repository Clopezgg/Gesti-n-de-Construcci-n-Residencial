name: NEXORA net income regression

on:
  pull_request:
    branches: [main]
    paths:
      - nexora_app/nexora/dashboard/analytics_core.py
      - nexora_app/nexora/dashboard/source_query.py
      - nexora_app/nexora/dashboard/snapshot_query.py
      - nexora_app/nexora/nexora/page/nexora-dashboard/nexora-dashboard.js
      - nexora_app/nexora/tests/test_dashboard_net_income*.py
      - .github/workflows/nexora-net-income.yml
  push:
    branches: [main]
    paths:
      - nexora_app/nexora/dashboard/analytics_core.py
      - nexora_app/nexora/dashboard/source_query.py
      - nexora_app/nexora/dashboard/snapshot_query.py
      - nexora_app/nexora/nexora/page/nexora-dashboard/nexora-dashboard.js
      - nexora_app/nexora/tests/test_dashboard_net_income*.py
      - .github/workflows/nexora-net-income.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mysql:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Validate pure and UI contracts
        run: |
          set -euo pipefail
          PYTHONPATH=nexora_app python -m unittest \
            nexora.tests.test_dashboard_net_income \
            nexora.tests.test_dashboard_net_income_contract -v
          node --check nexora_app/nexora/nexora/page/nexora-dashboard/nexora-dashboard.js
      - name: Install ERPNext test bench
        env:
          DB: mariadb
          TYPE: server
          FRAPPE_USER: frappe
          FRAPPE_BRANCH: version-15
          PAYMENTS_BRANCH: version-15
        run: bash .github/helper/install.sh
      - name: Install NEXORA and execute MariaDB regression
        shell: bash
        run: |
          set -euo pipefail
          cd ~/frappe-bench
          ln -s "$GITHUB_WORKSPACE/nexora_app" apps/nexora
          ./env/bin/pip install -e apps/nexora
          python "$GITHUB_WORKSPACE/scripts/register_nexora_app.py" sites/apps.txt
          bench --site test_site install-app nexora
          bench --site test_site migrate
          bench --site test_site run-tests --app nexora \
            --module nexora.tests.test_dashboard_net_income_integration
