name: Patch

on:
  pull_request:
    paths-ignore:
      - '**.js'
      - '**.css'
      - '**.md'
      - '**.html'
      - '**.csv'
  workflow_dispatch:

concurrency:
  group: patch-develop-${{ github.event_name }}-${{ github.event.number || github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    name: Patch Test

    services:
      mysql:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: 'root'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Setup Python
        uses: "actions/setup-python@v5"
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        # install.sh puede colgarse en un mirror de apt lento o caído sin
        # avisar (diagnosticado en Bloque 64 para los otros tres workflows
        # que ya llevan este mismo acotamiento); este archivo nunca lo tuvo
        # y una corrida real quedó colgada hasta el timeout-minutes de 60
        # del job entero, reportado como "cancelled" sin ninguna pista de
        # la causa real (Bloque 81). `set -o pipefail` es obligatorio:
        # sin él, el código de salida 124 de `timeout` se pierde detrás del
        # de `tee` (casi siempre 0).
        #
        # 25m resultó insuficiente en la práctica: una corrida real de este
        # mismo job (Bloque 115, PR #271, 2026-08-19) quedó colgada en el
        # mismo mirror `archive.ubuntu.com` desde `16:18:14Z` hasta el corte
        # en `16:43:14Z` (exit 124) — la misma clase de estrangulamiento ya
        # documentada con evidencia real en Bloque 112 para los otros tres
        # workflows. `timeout-minutes: 60` del job entero deja margen de
        # sobra para 45m internos más el resto de los pasos.
        run: |
          set -euo pipefail
          pip install frappe-bench
          timeout --signal=INT --kill-after=30s 45m \
            bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          DB: mariadb
          TYPE: server
          FRAPPE_BRANCH: v15.115.4
          PAYMENTS_BRANCH: version-15

      - name: Run Patch Tests
        run: |
          cd ~/frappe-bench/
          bench remove-app payments --force
          jq 'del(.install_apps)' ~/frappe-bench/sites/test_site/site_config.json > tmp.json
          mv tmp.json ~/frappe-bench/sites/test_site/site_config.json

          wget https://erpnext.com/files/v13-erpnext.sql.gz
          bench --site test_site --force restore ~/frappe-bench/v13-erpnext.sql.gz

          git -C "apps/frappe" remote set-url upstream https://github.com/frappe/frappe.git
          git -C "apps/erpnext" remote set-url upstream https://github.com/frappe/erpnext.git

          function update_to_version() {
            version=$1

            branch_name="version-$version-hotfix"
            echo "Updating to v$version"

            git -C "apps/frappe" fetch --depth 1 upstream $branch_name:$branch_name
            git -C "apps/erpnext" fetch --depth 1 upstream $branch_name:$branch_name
            git -C "apps/frappe" checkout -q -f $branch_name
            git -C "apps/erpnext" checkout -q -f $branch_name

            pgrep honcho | xargs kill
            rm -rf ~/frappe-bench/env
            bench -v setup env
            bench pip install -e ./apps/erpnext
            bench start &>> ~/frappe-bench/bench_start.log &

            bench --site test_site migrate
          }

          update_to_version 14

          echo "Updating to latest version"
          git -C "apps/frappe" fetch --depth 1 upstream "${FRAPPE_CI_REF}"
          git -C "apps/frappe" checkout -q -f FETCH_HEAD
          git -C "apps/erpnext" checkout -q -f "$GITHUB_SHA"

          pgrep honcho | xargs kill
          rm -rf ~/frappe-bench/env
          bench -v setup env
          bench pip install -e ./apps/erpnext
          bench start &>> ~/frappe-bench/bench_start.log &

          bench --site test_site migrate

        env:
          FRAPPE_CI_REF: v15.115.4

      - name: Show bench output
        if: ${{ always() }}
        run: |
          if [[ ! -d ~/frappe-bench ]]; then
            echo "frappe-bench was not created; no bench logs are available."
            exit 0
          fi
          cd ~/frappe-bench
          cat bench_start.log || true
          if [[ -d logs ]]; then
            cd logs
            for f in ./*.log*; do
              [[ -e "$f" ]] || continue
              echo "Printing log: $f"
              cat "$f"
            done
          fi
